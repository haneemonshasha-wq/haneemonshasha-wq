<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="130">
  <defs>
    <!-- Dark Sovereign Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0208" />
      <stop offset="50%" stop-color="#180514" />
      <stop offset="100%" stop-color="#050005" />
    </linearGradient>

    <!-- Instagram Royal Gradient -->
    <linearGradient id="instaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4" />
      <stop offset="50%" stop-color="#fd1d1d" />
      <stop offset="100%" stop-color="#fcb045" />
    </linearGradient>

    <!-- Light Sweep Beam -->
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&amp;family=Fira+Code:wght@600&amp;display=swap');

      /* Border Glow Pulse */
      .glowing-border {
        stroke: url(#instaGradient);
        stroke-width: 2;
        animation: borderPulse 3s ease-in-out infinite alternate;
      }

      @keyframes borderPulse {
        0% { opacity: 0.4; filter: drop-shadow(0 0 2px #fd1d1d); }
        100% { opacity: 1; filter: drop-shadow(0 0 12px #833ab4); }
      }

      /* Holographic Light Beam Sweep */
      .shine-beam {
        animation: shineSweep 4s ease-in-out infinite;
      }

      @keyframes shineSweep {
        0% { transform: translateX(-500px) skewX(-30deg); }
        30%, 100% { transform: translateX(600px) skewX(-30deg); }
      }

      /* Instagram Icon Pulse */
      .insta-icon {
        animation: iconFloat 3s ease-in-out infinite alternate;
        transform-origin: 65px 65px;
      }

      @keyframes iconFloat {
        0% { transform: scale(0.96); filter: drop-shadow(0 0 5px #fd1d1d); }
        100% { transform: scale(1.06); filter: drop-shadow(0 0 18px #fcb045); }
      }

      /* Text Styling */
      .brand-title {
        font-family: 'Cinzel', serif;
        font-weight: 900;
        font-size: 16px;
        fill: #FFFFFF;
        letter-spacing: 4px;
      }

      .handle-text {
        font-family: 'Fira Code', monospace;
        font-weight: 600;
        font-size: 18px;
        fill: url(#instaGradient);
        letter-spacing: 2px;
      }

      .action-tag {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        fill: #a0a0a0;
        letter-spacing: 3px;
        animation: blinkTag 1.5s ease-in-out infinite alternate;
      }

      @keyframes blinkTag {
        0% { opacity: 0.4; }
        100% { opacity: 1; fill: #ffffff; }
      }
    </style>
  </defs>

  <!-- Main Card Container -->
  <rect x="5" y="5" width="490" height="120" rx="15" fill="url(#cardBg)" class="glowing-border" />

  <!-- Light Beam Sweep Overlay -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="120" height="130" fill="url(#shineGrad)" class="shine-beam" />
  </g>

  <!-- Instagram Animated Icon Group -->
  <g class="insta-icon">
    <!-- Camera Body -->
    <rect x="40" y="40" width="50" height="50" rx="14" fill="none" stroke="url(#instaGradient)" stroke-width="4" filter="url(#neonGlow)" />
    <!-- Lens -->
    <circle cx="65" cy="65" r="12" fill="none" stroke="url(#instaGradient)" stroke-width="4" />
    <!-- Flash -->
    <circle cx="78" cy="52" r="3" fill="#ffffff" />
  </g>

  <!-- Text & Handles -->
  <text x="115" y="48" class="brand-title">SOVEREIGN NETWORK</text>
  <text x="115" y="75" class="handle-text">@ar_m13o09</text>
  <text x="115" y="100" class="action-tag">[ CLICK TO CONNECT ON INSTAGRAM ] ⚡</text>

  <!-- Corner Accents -->
  <path d="M 15,25 L 15,15 L 25,15" fill="none" stroke="#fd1d1d" stroke-width="2" />
  <path d="M 485,25 L 485,15 L 475,15" fill="none" stroke="#833ab4" stroke-width="2" />
  <path d="M 15,105 L 15,115 L 25,115" fill="none" stroke="#fcb045" stroke-width="2" />
  <path d="M 485,105 L 485,115 L 475,115" fill="none" stroke="#fd1d1d" stroke-width="2" />
</svg>
